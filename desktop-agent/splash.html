<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* ── Container ── */
    .splash {
      width: 480px;
      height: 300px;
      background: linear-gradient(145deg, rgba(8, 12, 24, 0.98) 0%, rgba(6, 9, 19, 0.99) 100%);
      border: 1px solid rgba(79, 142, 247, 0.15);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.7),
        0 0 80px rgba(16, 185, 129, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Background blobs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 220px; height: 220px;
      top: -80px; left: -80px;
      background: radial-gradient(circle, rgba(79, 142, 247, 0.18) 0%, transparent 70%);
    }
    .blob-2 {
      width: 200px; height: 200px;
      bottom: -70px; right: -70px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    }
    .blob-3 {
      width: 140px; height: 140px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(167, 139, 250, 0.08) 0%, transparent 70%);
    }

    /* ── Grid lines ── */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 142, 247, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 142, 247, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }

    /* ── Content ── */
    .content {
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo icon ── */
    .logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Outer spinning ring */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
    }
    .ring-outer {
      border-top-color: rgba(16, 185, 129, 0.9);
      border-right-color: rgba(16, 185, 129, 0.2);
      animation: spin-cw 2.8s linear infinite;
    }
    .ring-mid {
      inset: 8px;
      border-left-color: rgba(79, 142, 247, 0.8);
      border-bottom-color: rgba(79, 142, 247, 0.2);
      animation: spin-ccw 2s linear infinite;
    }
    .ring-inner {
      inset: 18px;
      border-top-color: rgba(167, 139, 250, 0.7);
      animation: spin-cw 1.2s linear infinite;
    }

    /* Core icon */
    .core {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(79, 142, 247, 0.2));
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      animation: pulse-core 2s ease-in-out infinite;
    }
    .core svg { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.7)); }

    @keyframes spin-cw  { to { transform: rotate(360deg);  } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes pulse-core {
      0%, 100% { box-shadow: 0 0 20px rgba(16,185,129,0.3); }
      50%       { box-shadow: 0 0 35px rgba(16,185,129,0.6), 0 0 60px rgba(16,185,129,0.2); }
    }

    /* ── Brand text ── */
    .brand-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .brand-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .brand-tag-text {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(16, 185, 129, 0.85);
    }

    /* ── Loader bar ── */
    .loader-wrap {
      margin-top: 24px;
      width: 180px;
    }
    .loader-label {
      font-size: 11px;
      color: rgba(148, 163, 184, 0.5);
      font-weight: 500;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      animation: text-fade 1.6s ease-in-out infinite;
    }
    @keyframes text-fade {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.9; }
    }
    .loader-track {
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #10b981, #4f8ef7, #a78bfa, #10b981);
      background-size: 200% 100%;
      animation: loading-bar 2s ease-in-out infinite;
    }
    @keyframes loading-bar {
      0%   { background-position: 200% 0; width: 0%;   }
      50%  { background-position: 0% 0;   width: 100%; }
      100% { background-position: -200% 0; width: 100%;}
    }

    /* ── Version badge ── */
    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: rgba(148, 163, 184, 0.3);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid"></div>

    <div class="content">
      <div class="logo-wrap">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7V12C3 16.55 6.84 20.74 12 22C17.16 20.74 21 16.55 21 12V7L12 2Z"
              fill="rgba(16,185,129,0.9)" stroke="rgba(16,185,129,0.5)" stroke-width="0.5"/>
            <path d="M9 12L11 14L15 10" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="brand-name">WorkforceOS</div>
      <div class="brand-tag">
        <div class="brand-dot"></div>
        <span class="brand-tag-text">Desktop Agent &nbsp;·&nbsp; v2.0</span>
      </div>

      <div class="loader-wrap">
        <div class="loader-label">Initializing Secure Connection...</div>
        <div class="loader-track">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>

    <div class="version">WorkforceOS © 2026</div>
  </div>
</body>
</html>
