<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkforceOS Tracking Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --productive: #10b981;
      --unproductive: #ef4444;
      --neutral: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 380px;
      height: 560px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
    }

    /* Window Header - Drag Bar */
    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.6);
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--glass-border);
    }

    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .titlebar-controls {
      display: flex;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .win-btn:hover {
      transform: scale(1.15);
    }

    .win-close {
      background: #f87171;
    }

    .win-min {
      background: #fbbf24;
    }

    /* Main Container with Glassmorphism */
    .container {
      position: relative;
      height: calc(100% - 40px);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Animation effects */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- LOGIN VIEW --- */
    .login-view {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .login-header {
      text-align: center;
    }

    .logo-icon {
      font-size: 40px;
      color: var(--primary);
      margin-bottom: 12px;
      animation: pulseLogo 3s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.8)); }
    }

    .login-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .login-btn {
      background: var(--primary);
      border: none;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .error-msg {
      color: var(--unproductive);
      font-size: 13px;
      text-align: center;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }

    /* --- TRACKING VIEW --- */
    .tracking-view {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 16px;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .user-details h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .user-details p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Stopwatch Widget */
    .stopwatch-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
    }

    .stopwatch-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stopwatch-time {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Tracking Switch Row */
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .control-label {
      font-weight: 600;
      font-size: 14px;
    }

    /* Toggle Switch styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--neutral);
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Live Telemetry Display Card */
    .telemetry-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 110px;
    }

    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neutral);
    }

    .status-dot.active {
      background: var(--productive);
      animation: pulseDot 1.5s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .app-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-process {
      font-weight: 600;
      font-size: 15px;
    }

    .app-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-productive {
      background: rgba(16, 185, 129, 0.15);
      color: var(--productive);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .badge-unproductive {
      background: rgba(239, 68, 68, 0.15);
      color: var(--unproductive);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .badge-neutral {
      background: rgba(100, 116, 139, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(100, 116, 139, 0.25);
    }

    .app-title-text {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .logout-row {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Custom Frameless Titlebar -->
  <div class="titlebar">
    <div class="titlebar-title">WorkforceOS Agent</div>
    <div class="titlebar-controls">
      <button class="win-btn win-min" id="btn-minimize" title="Minimize"></button>
      <button class="win-btn win-close" id="btn-close" title="Close"></button>
    </div>
  </div>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div class="login-view fade-in" id="login-view">
      <div class="login-header">
        <div class="logo-icon">📊</div>
        <h2>WorkforceOS</h2>
        <p>Employee desktop tracking agent</p>
      </div>

      <div class="error-msg" id="error-msg">Invalid Credentials</div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@wfh.com" value="employee1@wfh.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" value="password123">
      </div>

      <button class="login-btn" id="btn-login">Sign In</button>
    </div>

    <!-- TRACKING CONTROL SCREEN -->
    <div class="tracking-view" id="tracking-view">
      
      <!-- User profile header -->
      <div class="user-profile">
        <div class="avatar-circle" id="user-avatar">A</div>
        <div class="user-details">
          <h3 id="user-name">Alice Green</h3>
          <p id="user-dept">Engineering Department</p>
        </div>
      </div>

      <!-- Live Timer -->
      <div class="stopwatch-card">
        <div class="stopwatch-label">Current Session Time</div>
        <div class="stopwatch-time" id="stopwatch">00:00:00</div>
      </div>

      <!-- ON/OFF Switch -->
      <div class="control-row">
        <div class="control-label" id="control-status">Tracking Inactive</div>
        <label class="switch">
          <input type="checkbox" id="tracking-switch">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Focused App details -->
      <div class="telemetry-card">
        <div class="telemetry-header">
          <div class="telemetry-title">Focused Application</div>
          <div class="status-indicator">
            <span class="status-dot" id="telemetry-dot"></span>
            <span id="telemetry-status-text">Stopped</span>
          </div>
        </div>

        <div class="app-info" id="telemetry-app-info">
          <div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 10px;">
            Turn tracking ON to monitor app usage.
          </div>
        </div>
      </div>

      <!-- Logout option -->
      <div class="logout-row">
        <button class="logout-btn" id="btn-logout">Sign Out</button>
      </div>

    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
