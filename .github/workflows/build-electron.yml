name: Build and Release Desktop Agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      - name: Copy Frontend Build to Desktop Agent
        run: |
          New-Item -ItemType Directory -Force -Path desktop-agent/react-build
          Copy-Item -Path frontend/build/* -Destination desktop-agent/react-build/ -Recurse -Force

      - name: Install Desktop Agent Dependencies
        working-directory: desktop-agent
        run: npm ci

      - name: Build Electron App
        working-directory: desktop-agent
        run: npm run build

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop-agent/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
